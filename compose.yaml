services:
  backend:
    build: .
    depends_on:
      - postgres
    networks:
      backend-network:
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}

  postgres:
    image: "postgres:18.4-alpine"
    environment:
          POSTGRES_DB: ${POSTGRES_DB}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - '5432'
    networks:
      backend-network:

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incidents_platform"]
      interval: 5s
      timeout: 5s
      retries: 10


networks:
  backend-network:

volumes:
  postgres_data:
