spring:
  application:
    name: Backend
  datasource:
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:@@abdo@@}
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:incidents_platform}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

logging:
  level:
    org:
      springframework: DEBUG
      hibernate: DEBUG

cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:5173"


jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS}
  cookieName: "jwtCookie"
  cookieSecure: ${JWT_COOKIE_SECURE:false}



